<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontak | Website Satgas PPKPT</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="navbar-logo">
      <img src="images/logo ppks.jpg" alt="Logo Satgas PPKPT" class="logo-img">
      <div class="logo-text">
        <h1 class="logo">Satgas PPKPT</h1>
        <p class="logo-sub">Politeknik Negeri Cilacap</p>
      </div>
    </div>
    <nav>
      <ul class="menu">
        <li><a href="index.html" >Beranda</a></li>
        <li><a href="profil.html">Profil</a></li>
        <li><a href="layanan.html">Layanan</a></li>
        <li><a href="kegiatan.html">Kegiatan</a></li>
        <li><a href="kontak.html" class="aktif">Kontak</a></li>
      </ul>
    </nav>
    <button id="tombol-tema" type="button">Mode Gelap</button>
  </header>

    <main>
        <section class="kontak-container">
            <h2>Hubungi Kami</h2>
            <form id="formKontak">
                <div class="form-group">
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" name="nama">
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="form-group">
                    <label for="pesan">Pesan:</label>
                    <textarea id="pesan" name="pesan" rows="5"></textarea>
                </div>

                <button type="submit">Kirim Pesan</button>
            </form>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
